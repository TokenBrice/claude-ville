    emitters:
      smoke: [183, 6]
      forgeEmber: [80, 150]
      forgeSpark: [104, 198]
      sparkle: [150, 165]
    lightSource: [80, 165]
    lightColor: '#ff8a33'
    lightRadius: 80
    lightOverlay: 'atmosphere.light.fire-glow'
    layers:
      # 4.6 — the hearth fire is baked into base.png, so the sleeping-town rest
