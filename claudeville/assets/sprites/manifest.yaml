# ─── BUILDINGS ───────────────────────────────────────────────────────────────
# All buildings are single-image PNGs (buildings/<id>/base.png) per the building
# style contract (docs/building-style-contract.md): true 2:1 iso, slate-blue roofs,
# structure-only land art or a named structural platform exception, ≤400px.
# Terrain aprons are baked into the static world cache. Overlay layers
# (beacon/portalGlow, the inspection aperture layers) sit beside base.png.

buildings:
  # ── HERO: Command Center ── 4.2 re-authored (Observatory family, cool grey).
  # Pro model with the Observatory as style image and the pre-4.2 keep as
  # reference (c1), recoloured from cream to the family's cool grey, then the
  # gate inpainted taller: the oak leaf is ~71 px (~87 px with the steps), so
  # the door clears 1.2x the 48–75 px villagers. The building fills its 5x4
  # footprint (the front plinth corner sits on the SE footprint corner), and
  # the gate steps land on the entrance row. The two braziers are baked; the
  # old watchfire layer is retired. Sidecars are re-derived from reviewed
  # glass, fire, oak, cloth and gold colours, never from luminance; the
  # emissive sidecar is only the window glass and brazier flames, gated by
  # NightOccupancyGate.
  - id: building.command
    tool: generate-image-v2
    prompt: "isometric pixel art building sprite, true 2:1 dimetric isometric view from the south-east, the Command Center, the grandest building in town: a heroic castle keep with a tall central hall crowned by a large slate-blue tiled dome with a gold ring and gold finial, a tall square stone tower with a slate-blue spire and a small gold flag on the left, a round crenellated stone tower on the right, two lower side wings with slate-blue roofs, the right wing has a long plain right-facing wall with three small windows, one huge arched main gate with heavy oak double doors in the front wall facing the lower-left, as tall as a third of the keep, reached by two broad stone steps and flanked by two lit iron braziers, crimson banners with gold emblems on the walls, cream limestone ashlar walls with a darker stone base course, small arched windows with warm amber glass. Warm light from the upper left. Structure only on a transparent background: no ground tile, no paved floor, no cobble plaza, no lawn, no platform, no plinth, no cast shadow, no text."
    provenance: { item: '4.2', endpoint: generate-image-v2, jobId: 42f7aab2-6e0a-45c8-b335-1afcd25448a0, styleImage: building.observatory, referenceImage: 'building.command (pre-4.2)', generationSize: 360x240, generations: 25, pilotGenerations: 145, recolor: 'cream -> family cool grey (hand, not generated)', edit: { endpoint: inpaint-v3, jobId: 1c219d8c-5bce-48be-88f8-7dea9c1690a9, seed: 1234, crop: 200x200, generations: 20, note: 'gate leaf ~45 -> ~71 px; seam patches beside the steps hand-recoloured to the stone ramp' }, generatedAt: '2026-09-25' }
    width: 360
    height: 240
    anchor: [199, 164]
    materialClass: stone
    materialSidecar: true
    emissiveSidecar: true
    occluderSidecar: true
    # 2.3 — occluder R = true height, B = surface code (face x 64 + h/4),
    # baked by scripts/sprites/bake-surface-channel.mjs; the GPU reads B.
    surfaceCode: true
    # 6.3 — base.rooms.png: R = room index (1..N) on each room's glass,
    # baked by scripts/sprites/bake-room-masks.mjs.
    roomsSidecar: true
    atlasFrame: { atlas: world-pilot, key: building.command }
    elevation: { base: 0, top: 240, unit: sprite-px }
    emissive:
      strength: 1
      sources:
        - { id: emissive.command.windows, kind: windows, geometry: registry.windowRects, strength: 0.72 }
        - { id: emissive.command.braziers, kind: fire, geometry: emitters.torch, strength: 1 }
    occluder: { mode: alpha-silhouette, strength: 1, horizonY: 112 }
    splitForOcclusion: true
    horizonY: 112
    layers:
      # 4.1 — inspection aperture (plan claudeville-frontier-visual-plan §4.1).
      # Hand-authored at the base's own 360x240 pixel scale and clipped to the
      # east wing's plain right-facing wall (x 228–312), measured per column
      # from the art's cornice and plinth outlines. BuildingSprite draws these
      # three itself, only while Command is the explicitly selected building
      # at resting zoom >= 2, in the fixed order aperture -> occupants ->
      # interior -> slot marks -> foreground; the generic manifest-layer pass
      # skips them, so they never appear on the default frame.
      aperture:
        tool: hand-authored
        prompt: "sectional cut through the Command east wing wall: shaded ceiling, stone back wall with course lines, a single wall sconce, cool stone floor; authored, not generated"
        width: 360
        height: 240
        anchor: [199, 164]
        materialClass: stone
      interior:
        tool: hand-authored
        prompt: "Command inspection interior dressing composed from the prop.interior kit: reading desk, planning table, instrument stand, pinned parchment; authored, not generated"
        width: 360
        height: 240
        anchor: [199, 164]
        materialClass: timber
      foreground:
        tool: hand-authored
        prompt: "near frame of the Command aperture: sawn floor-slab sill, near jamb outline and the far jamb's exposed wall thickness that occlude the presented occupant; authored, not generated"
        width: 360
        height: 240
        anchor: [199, 164]
        materialClass: stone
      # 6.2 — the lifted gate (visible leaf y 116–193 = 78 px, 1.2× the 1:1
      # body; the leaf bottom was pushed 1 row down over the threshold in
      # base.png, its sidecars and this strip; the porch
      # front, crest and arch were raised 10 px by a row remap in base.png
      # and its sidecars, the drum window kept) as a closed / ajar / open
      # strip: leaves swing in, the dark hall #1a1310 over a stepped warm
      # floor on the C1 emissive ramp. Frame 0 is the base crop. Open while
      # Command has a working visitor (V8); one-shot on arrival.
      gate:
        tool: hand-authored
        prompt: "Command gate closed / ajar / open: the base oak leaves swung inward, dark hall #1a1310 with a stepped warm floor on the C1 emissive ramp; authored, not generated"
        width: 120
        height: 80
        frames: 3
        frameW: 40
        frameH: 80
        anchor: [131, 198]
        fps: 8
        staticFrame: 0
        gate: door.command
        oneShot: true
        restIsBase: true
        materialClass: timber
      # W5.3 / W8.1 — the attention banner: one cloth hung from an iron rod
      # under the flag tower's cornice, on the tower's front face. A STATUS
      # part (BuildingPartGates `status.<bucket>`), never a work part: the
      # lead actionable bucket (needs-you > error > limit, the TopBar
      # ATTENTION_PARTS rule) hangs its own layer, and the frame is the drop
      # for SignalLedger.waitAgeTier of the oldest actionable wait — frame 0
      # empty (restIsBase), frames 1–4 hang 25 / 45 / 65 / 85 cloth rows (< 1,
      # 1–5, 5–15, >= 15 min). Hard frame swaps only; no light, no motion.
      # One pixflux cloth (init 120, colour image on the needs-you ramp);
      # drops, the baked EventShapes motif and the error / limit hue re-tones
      # are offline (scripts/sprites/bake-banner-stones.mjs).
      banner:
        tool: generated
        prompt: "long vertical heraldic cloth banner hanging straight down from a short dark iron rod with gold end caps, saturated warm yellow cloth with a darker ochre stitched border, plain cloth face, swallowtail bottom edge, flat front view, castle wall banner"
        provenance: { item: 'W8.1', endpoint: create-image-pixflux, seed: 11, generationSize: 32x96, initImageStrength: 120, colorImage: 'needs-you ramp #e8d44d + iron + gold', generations: 1, pilotGenerations: 2, post: 'drops 25/45/65/85, needs-you motif, hue-snapped to #e8d44d (bake-banner-stones.mjs)', generatedAt: '2026-10-09' }
        width: 150
        height: 89
        frames: 5
        frameW: 30
        frameH: 89
        anchor: [89, 155]
        staticFrame: 0
        gate: status.needsYou
        restIsBase: true
        materialClass: fabric
      bannerError:
        tool: generated
        prompt: "the attention banner re-toned offline onto the errored hue #e06c5b with the alert motif (derived from building.command.banner by scripts/sprites/bake-banner-stones.mjs)"
        width: 150
        height: 89
        frames: 5
        frameW: 30
        frameH: 89
        anchor: [89, 155]
        staticFrame: 0
        gate: status.errors
        restIsBase: true
        materialClass: fabric
      bannerLimit:
        tool: generated
        prompt: "the attention banner re-toned offline onto the rate-limited hue #f06ae0 with the limit-gate motif (derived from building.command.banner by scripts/sprites/bake-banner-stones.mjs)"
        width: 150
        height: 89
        frames: 5
        frameW: 30
        frameH: 89
        anchor: [89, 155]
        staticFrame: 0
        gate: status.quota
        restIsBase: true
        materialClass: fabric
      # 6.1 / V4 — the two gate braziers' painted tongues climb (EmitterCycle
      # `mode: tongues`, 2-column lanes over a 1-texel bed) while the village
      # lamps are lit (`lamps`, like the Pharos lens): fixtures of the lamp
      # course that never read agent state, so by day an empty Command is its
      # authored base. Mask only: never drawn as art. The first cut's rank wave
      # swapped whole 4-row bands of these 7-row flames onto the tan edge shade
      # #d4984e.
      braziers:
        tool: hand-authored
        prompt: "cycle mask: the baked flame texels of the two gate braziers; authored, not generated"
        width: 360
        height: 240
        anchor: [199, 164]
        cycle: { gate: lamps, mode: tongues, lanePx: 2, keepPx: 1, hz: 6 }
    # The two gate braziers (architectural fires) and the gold finial/crest.
    emitters:
      torch: [94, 180]
      torch2: [148, 204]
      sparkle: [174, 10]
      sparkle2: [133, 122]
    # Phase 2.5.5: light-reflection compositing reads these to additively
    # tint nearby water tiles. Anchor is sprite-local pixels (the gate foot).
    lightSource: [124, 196]
    lightColor: '#ffcc66'
    lightRadius: 80

  # ── HERO: Harbor Lighthouse (watchtower) ──
  # Single-image (was composeGrid [4,3]); narrow/tall Pharos per the building
  # style contract. The lamp is the `beacon` layer seated in the lantern glass
  # (6.1: drawn by partDrawsFor on both backends; the `lens` cycle steps it).
  # Night light: one warm mirror shaft, clock-gated embers and crown exhaust
  # at registry.effectAnchors.smokeTop; windows still require working visitors.
  # QAWorld F8 — the baked blue grid-tile plinth is cleared to alpha (the
  # terrain/coast bakes paint the ground around it); a hand-authored 7 px
  # limestone footing on the tower's own stone colours replaces it, the stair
  # landing on the ground. The emissive sidecar is the six window glasses
  # (alpha 0.68), measured on base.png, never luminance.
  - id: building.watchtower
    tool: map_object
    prompt: "Pharos Lighthouse — tall narrow heroic cool-grey stone lighthouse tower with strong light-to-shadow contrast, tapering stacked circular stages, small arched windows, bronze lantern crown with the flame area left dark for the beacon overlay, lower structural stone quay with a connected short stair and localized wet water-contact edge. Narrow vertical silhouette, much taller than wide. No generic square ground tile, no unsupported platform, no pale pastel, no modern beam."
    width: 288
    height: 384
    anchor: [144, 320]
    materialClass: stone
    emissiveSidecar: true
    occluderSidecar: true
    surfaceCode: true
    roomsSidecar: true
    atlasFrame: { atlas: world-pilot, key: building.watchtower }
    elevation: { base: 0, top: 384, unit: sprite-px }
    emissive:
      strength: 1
      sources:
        - { id: emissive.watchtower.windows, kind: windows, geometry: registry.windowRects, strength: 0.68 }
        - { id: emissive.watchtower.beacon, kind: fire, geometry: layer.beacon, strength: 1 }
    occluder: { mode: alpha-silhouette, strength: 1, horizonY: 300 }
    splitForOcclusion: true
    horizonY: 300
    layers:
      # 6.1 — the Pharos lamp: the original generated 64x64 beacon.png cropped
      # to its flame and bowl (cols 23-40, rows 5-29; the pedestal dropped) and seated on the
      # lantern floor inside the glass; the texels that fell on the lantern
      # roof were cleared so the roof stays in front. Static art (the old
      # smooth-sine alpha pulse is gone, V4); a fixture, so on the GPU it
      # emits through no occupancy gate (M22).
      beacon:
        tool: map_object
        prompt: "isolated warm lantern flame for a lighthouse crown, orange amber pixel fire with a bright golden core and soft warm halo, thin tile, transparent background only, no ground tile, no square base, no platform, no cube block, no modern beam, empty transparent corners"
        width: 18
        height: 25
        anchor: [145, 84]
        fixture: true
        materialClass: fire
        emissive:
          strength: 1
          sources:
            - { id: emissive.watchtower.beacon, kind: fire, geometry: authored-albedo, strength: 1 }
        occluder: { mode: alpha-silhouette, strength: 0.35 }
      # 6.1 / V4 (OE-1) — the lens cycle mask over the lamp's flame texels
