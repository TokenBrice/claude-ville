style:
  assetVersion: "2026-09-28-waking-isle-emitters"
  anchor: "epic high-fantasy pixel art, dramatic lighting, painterly palette, crisp pixel edges, no anti-aliasing, heroic silhouettes, faint magical glow on landmarks"

# Optional semantic channels. Canvas mode keeps loading the original albedo
# paths; GPU consumers opt into this contract and use deterministic defaults
# whenever an individual sidecar is absent.
materialContract:
  version: 1
  sampling: nearest
  keyLight: warm-upper-left
  responseBands: [0.72, 0.86, 1.0, 1.12]
  channels: [albedo, material, emissive, occluder]

atlases:
  - id: world-pilot
    maxWidth: 2048
    padding: 2
    powerOfTwo: true
    metadata: assets/sprites/atlases/world-pilot.json
    channels:
      albedo: assets/sprites/atlases/world-pilot.albedo.png
      material: assets/sprites/atlases/world-pilot.material.png
      emissive: assets/sprites/atlases/world-pilot.emissive.png
      occluder: assets/sprites/atlases/world-pilot.occluder.png
    ids:
      - agent.claude.opus
      - agent.codex.gpt56sol
      - building.command
      - building.watchtower
      - building.harbor
      - building.observatory
      - building.portal
      - building.forge
      - building.mine
      - building.taskboard
      - building.archive
      - prop.lantern
      - prop.runeBrazier
      - prop.bridgeLanternPost
      - terrain.shore-shallow
      - terrain.shallow-deep
      - atmosphere.light.lighthouse-beam
      - atmosphere.light.fire-glow
      - atmosphere.light.lantern-glow

# ─── CHARACTERS ──────────────────────────────────────────────────────────────
# Character sheets are 8 direction columns by 10 animation rows:
# 6 walk rows followed by 4 breathing-idle rows, with 92px square cells.
# Optional `required_equipment` entries are validated in every walk and idle
# cell for baked-equipment characters. Prefer runtime equipment overlays when
# pose consistency matters across generated animation frames.
# Optional `paletteSource` pins the per-sheet garment pixel colors the
# Compositor keys on (sampled from the actual PNG; up to two garment families
# per role): `trim` takes the provider trim ramp, `robe` takes the variant's
# value step, `pants` is informational. A role without a source is untouched.
characters:
  # Pro mode fixed cross-direction consistency (standard mode produced
  # different outfits per angle). Avoid ambiguous color language like
  # "shifting violet to gold" — it caused per-angle palette flips.
  - id: agent.claude.fable
    tool: create_character
    prompt: "Claude Fable transcendent mythweaver sovereign, legendary female storyteller-archmage who outranks all other arcane masters, floor-length ivory and royal crimson ceremonial robe with ornate gold filigree, deep violet starfield cloak with gold constellation embroidery hanging from her shoulders, long flowing platinum starlit hair, radiant golden star-crown resting firmly on her head, glowing ancient storybook clasped at her chest, luminous quill-tipped staff held upright close to her body, soft golden constellation motes near her shoulders, compact majestic old-school RPG sorceress, identical outfit and colors from every viewing angle, no wings, no horns, no revealing outfit"
    n_directions: 8
    size: 92
    generationSize: 76
    generationMode: pro
    animations: [walk, breathing-idle]
    animationGroups: { walk: { rows: [0, 5] }, breathingIdle: { rows: [6, 9] } }
    portraitCrop: { x: 28, y: 9, w: 34, h: 30 }
    provenance: { characterId: 3cef2064-b3dd-4f17-ab8a-ff35ed2ee379 }
    palette_layer: claude
    # Sampled from sheet.png (plan 0.5): crimson gown + gold filigree; the
    # declared claude sources match nothing on this sheet.
    paletteSource: { robe: ['#8a1d34', '#20143e'], trim: '#dfc18a' }
    anchor: [46, 80]
    materialClass: fabric
    materialSidecar: true
    emissiveSidecar: true
    occluderSidecar: true
    elevation: { base: 0, top: 80, unit: sprite-px }
    emissive:
      strength: 0
      sources:
        - { id: emissive.agent.claude.fable.constellations, kind: rune, geometry: sidecar, strength: 0.1 }
    occluder: { mode: alpha-silhouette, strength: 1 }

