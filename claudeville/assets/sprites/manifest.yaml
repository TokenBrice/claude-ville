  # forge as a massing reference (furnace arch on the SW gable, chimney at the
  # back right, anvil and quench trough in the yard); alpha-thresholded, placed
  # 8 px right and snapped to the family palette (55 colours). Two candidates
  # (f1/f2, 40 generations), f2 chosen. Sidecars and the banked mask are
  # re-derived from the reviewed fire/glass/timber colours.
  - id: building.forge
    tool: generate-image-v2
    prompt: "isometric pixel art building sprite, true 2:1 dimetric isometric view from the south-east, a Code Forge landmark: a compact stone blacksmith forge hall with soot-darkened grey stone walls and a steep dark blue-grey slate roof, one tall square stone chimney with a dark iron cap rising at the back right, a tall open arched workshop doorway on the left end wall with a glowing orange furnace fire inside spilling warm light, an iron anvil on a stone block and a stone quench trough beside the front wall, a timber tool rack with hammers and tongs, two small warm-lit windows. Warm light from the upper left. Structure only on a transparent background: no ground tile, no lawn, no platform, no plinth, no cast shadow, no text."
    provenance: { item: '4.5', endpoint: generate-image-v2, jobId: 59af4d9e-b105-4769-8e3f-c16a14f26090, styleImage: building.observatory, referenceImage: 'building.forge (pre-4.5)', generationSize: 256x232, generations: 20, pilotGenerations: 40, generatedAt: '2026-09-25' }
    width: 256
    height: 232
    anchor: [128, 169]
    materialClass: stone
    materialSidecar: true
    emissiveSidecar: true
    occluderSidecar: true
    atlasFrame: { atlas: world-pilot, key: building.forge }
