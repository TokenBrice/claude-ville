# ─── PALETTES ────────────────────────────────────────────────────────────────
# Canonical palette definitions. claudeville/assets/sprites/palettes.yaml mirrors
# this block for standalone tooling — keep both in sync if you edit either.
# Provider hue lives in trim (plan 2.6): the compositor recolours each sheet's
# declared `paletteSource.trim` to this ramp; declared robes keep their family
# and take the agent's crowd variant (value step + bounded hue turn, W2.3).
