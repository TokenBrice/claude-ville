# ─── ATMOSPHERE ──────────────────────────────────────────────────────────────
atmosphere:
  # atmosphere.deep-sea retired to output/attic (visual-quality plan
  # dead-inventory sweep): zero code references — the deep-sea reads are painted
  # procedurally by IsometricRenderer.
  - id: atmosphere.light.lighthouse-beam
    tool: isometric_tile
    prompt: "warm golden light reflection on water, soft shimmering caustics, transparent background"
    size: 64
    materialClass: fire
    atlasFrame: { atlas: world-pilot, key: atmosphere.light.lighthouse-beam }
    emissive:
      strength: 1
      sources:
        - { id: emissive.atmosphere.lighthouse-beam, kind: beacon, geometry: authored-albedo, strength: 1 }
    occluder: { mode: none, strength: 0 }

  - id: atmosphere.light.fire-glow
    tool: isometric_tile
    prompt: "orange-amber fire glow on ground, flickering radiant light pool, transparent background"
    size: 64
    materialClass: fire
    atlasFrame: { atlas: world-pilot, key: atmosphere.light.fire-glow }
    emissive:
      strength: 1
      sources:
        - { id: emissive.atmosphere.fire-glow, kind: fire, geometry: authored-albedo, strength: 1 }
    occluder: { mode: none, strength: 0 }

  - id: atmosphere.light.lantern-glow
