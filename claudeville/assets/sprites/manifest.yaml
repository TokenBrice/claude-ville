    size: 64

  - id: atmosphere.moon.gibbous.cool
    tool: map_object
    prompt: "cool silver gibbous moon, mostly illuminated disk with dark navy crescent shadow, pale blue rim light, no face, transparent background, pixel art"
    size: 64

  # atmosphere.sun retired to output/attic (Waking Isle 0.10 dead-inventory
  # sweep): zero code references — SkyRenderer draws the sun as its own
  # flat-to-core stepped disc on a 2 px cell (`_getSunStamp`).

  # atmosphere.fog.wisp.low, atmosphere.water.ripple.rain,
