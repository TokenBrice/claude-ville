    lightSource: [149, 107]
    lightColor: '#9fd1ff'
    lightRadius: 58

  # ── HERO: Portal Gate ── (single-image; was composeGrid [3,2], converted losslessly)
  - id: building.portal
    tool: map_object
    prompt: "epic portal gate archway, ancient stone arch with swirling arcane energy, violet and gold runes, massive scale, isometric, on an intentional structural dark-stone dais with connected stairs; no larger generic ground tile, no unsupported plinth, no baked cast shadow"
    width: 312
    height: 208
    anchor: [156, 182]
    materialClass: glass-rune
    atlasFrame: { atlas: world-pilot, key: building.portal }
    elevation: { base: 0, top: 208, unit: sprite-px }
    emissive:
