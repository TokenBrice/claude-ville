  - id: atmosphere.rain.splash
    tool: map_object
    prompt: "small pixel art rain splash crown, pale blue white droplets and tiny impact ripples, transparent background"
    width: 48
    height: 32

  # Living Isle W8.8 (AD-P14) — three aurora ribbon phases, A → B → C, drawn by
  # SkyRenderer (`_drawAurora`) above the sea horizon on clear Nov–Feb nights
