# ─── BRIDGES ─────────────────────────────────────────────────────────────────
bridges:
  # Central river footbridge (BRIDGE_HINTS central-river-bridge). Drawn at
  # native 1x with `anchor` on the deck midpoint's ground-plane point (the
  # hint tile, 18,24); the deck runs upper-right -> lower-left (NS) and the
  # stone abutments land on the bank tiles 22 and 26. REST pixflux returns this on a
  # flat grey card, so key the exact card colour (tight tolerance) rather than
  # the shared 85-per-channel flood fill, which eats the dark outlines.
  - id: bridge.landmark.civic.ns
    tool: map_object
    prompt: "isolated village footbridge centered in the frame with empty margins on every side, gently arched warm oak plank deck with curved timber handrails and carved corner posts, resting on mossy grey fieldstone abutments with rounded boulders and small wildflower clumps at both ends, two small brass lanterns with soft amber glow on the end posts, the bridge runs diagonally from upper-right to lower-left, wide enough for two people, no water, no ground tile, no square base, no baked cast shadow, no text, no characters, a single low grey stone arch beneath the wooden deck"
    width: 256
    height: 208
    anchor: [132, 124]

  # QAWorld F18 — both plank tiles re-toned offline from plum onto the C1
  # timber ramp (artPalette.js ART_RAMPS.timber): OKLab lightness kept per
  # colour, hue/chroma taken from the ramp at that lightness.
  - id: bridge.ew
    tool: isometric_tile
    # Referenced by scenery.js PLANK_BRIDGES command-pond-plank and drawn
    # through IsometricRenderer's dynamic `bridge.${orientation}` path.
    prompt: "weathered wooden bridge, plank deck, rope rails, east-west orientation, isometric"
    size: 64
    anchor: [32, 32]

  - id: bridge.ns
    tool: isometric_tile
    prompt: "weathered wooden bridge, plank deck, rope rails, north-south orientation, isometric"
    size: 64
    anchor: [32, 32]

  # dock.ew / dock.ns retired to output/attic (visual-quality plan dead-inventory
  # sweep): HARBOR_DOCK_TILES are all style 'causeway', which draws the procedural
  # _drawHarborCausewayTile — the per-tile dock sprite path is unreachable today.

# ─── LOOKUP TABLES ───────────────────────────────────────────────────────────
# Hand-authored, nearest-sampled palette tables. Not generated art: a LUT is a
# data image and carries no silhouette, anchor meaning, or material response.
# `lut.<name>` maps to `luts/<name>.png`.
luts:
  # 3.5 — Command light ramp. X = material class id in MATERIAL_CLASS_NAMES
  # order (0..10), Y = light course (0 barely lit, 1 mid, 2 light). RGB is a
  # tint multiplier encoded as texel*2 (128 ~ x1.0); A is an authored additive
  # lift scaled by 0.25. Absent entry keeps today's additive light response.
  - id: lut.light-ramp.command
    tool: hand-authored
    width: 11
    height: 3
    anchor: [0, 0]
    materialClass: unlit
