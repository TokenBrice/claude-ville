      # workload; the generic manifest-layer pass skips it.
      banked:
        tool: hand-authored
        prompt: "banked forge hearth mask: the authored furnace fire restated as stepped charcoal with a single ember course at the bed; authored, not generated"
        width: 256
        height: 232
        anchor: [128, 169]
        materialClass: stone

  # ── STANDARD: Token Mine ──
  # 4.5 (aesthetic plan, D3) — re-authored on the Observatory grid: REST
  # generate-image-v2 (Pro) with building.observatory as the style image
  # (m1, 60 colours; tunnel on the SW face toward the entrance tile), then the
  # baked ore cart was inpainted out (inpaint-v3, opaque pixels only) so the
  # track is empty and the ritual cart is the only cart. Alpha-thresholded and
  # snapped to the family palette. Sidecars are re-derived from the reviewed
  # crystal/lantern/timber colours. Rails are baked: BuildingSprite reads the
  # registry `railsBaked` flag and draws none of its own.
