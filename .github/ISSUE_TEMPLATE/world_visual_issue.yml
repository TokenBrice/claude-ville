name: World Or Visual Issue
description: Report a World mode, sprite, animation, or visual regression.
title: "[Visual] "
labels: ["bug", "area:world"]
body:
  - type: markdown
    attributes:
      value: |
        Screenshots are strongly preferred. Redact private project names or prompts.
  - type: dropdown
    id: surface
    attributes:
      label: Visual surface
      options:
        - World mode canvas
        - Agent sprites
        - Building sprites
        - Terrain or scenery
        - Dashboard rows or attention cards
        - Sidebar or activity panel
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What looks wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected visual result
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Include ClaudeVille's top-bar version (or commit), operating system, and browser version.
      placeholder: "ClaudeVille: ...; OS: ...; Browser: ..."
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Layout
      options:
        - Desktop (/)
        - Mobile (/m/)
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport and display scale
      description: "Record width x height, browser zoom, and display scale. Desktop / expects at least 1280px; /m/ supports smaller screens."
      placeholder: "1440x900, 100% browser zoom, 2x display scale; or 390x844 on /m/"
    validations:
      required: true
  - type: input
    id: renderer
    attributes:
      label: World renderer (if relevant)
      description: Shift-D shows the backend in the World debug overlay. Include any renderer URL flag you used; leave blank if unknown.
      placeholder: WebGPU, WebGL2, or Canvas 2D
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the view, action, and whether it also happens with ?sim=1. Do not share a URL containing private session IDs.
    validations:
      required: true
  - type: input
    id: motion
    attributes:
      label: Motion setting
      placeholder: normal motion or reduced motion
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or capture
      description: "Attach a screenshot/capture, or write `cannot capture — reason: <explanation>`."
    validations:
      required: true
